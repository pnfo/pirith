<!DOCTYPE html>
<html lang="si">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <!--head-start-->
    <title>පිරිත් - Pirith</title>
    <!--head-end-->
    <meta name="theme-color" content="#2e4c37">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Pirith">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="%BASE_URL%artwork/logo-180.png">
    <link rel="icon" type="image/png" sizes="96x96" href="%BASE_URL%favicon-96x96.png">
    <script>
      // before first paint: dark mode and text size chosen earlier (kept out of the bundle to avoid a flash)
      try {
        if (localStorage.getItem('darkMode') === 'true') document.documentElement.classList.add('dark')
        var fs = JSON.parse(localStorage.getItem('fontSize')); if (fs) document.documentElement.style.setProperty('--reader-size', fs)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"><!--app--></div>
    <!--state-->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
